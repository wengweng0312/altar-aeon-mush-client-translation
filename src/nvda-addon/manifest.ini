name = Mush Client
summary = Accessibility enhancements for Mush Client with optional Translation Mode review navigation.
version = 22
author = "福恩; Translation Mode integration by Mush-Z project"
minimumNVDAVersion = 2024.1
lastTestedNVDAVersion = 2026.2
description = """
Preserves the existing Mush Client output navigator support. Translation Mode expands multi-sentence rooms into real history rows. Numpad 4 and 6 move by sentence or word and synchronize with the actual review cursor after character or line-edge navigation. Shift+numpad1 and Shift+numpad3 move to the start and end of the current review line. Ctrl+Shift+Y is left to MUSHclient for outgoing Chinese chat translation.
"""
